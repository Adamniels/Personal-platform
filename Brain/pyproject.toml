[project]
name = "brain"
version = "0.1.0"
description = "The platform's memory, a service every feature depends on"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
