# The single entry point for CI. It works out from the diff which areas changed, runs the checks
# for those, and ends in `ci-ok`, the one always present check that branch protection requires.
# A required check that only runs on some paths would block every other pull request, and a job
# skipped by `if:` reports as skipped, so the gate is a job that runs every time and judges the rest.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read only: no job here writes to the repository or to GitHub.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.areas.outputs.core }}
      canary: ${{ steps.areas.outputs.canary }}
      brain: ${{ steps.areas.outputs.brain }}
      libs: ${{ steps.areas.outputs.libs }}
      scripts: ${{ steps.areas.outputs.scripts }}
      web: ${{ steps.areas.outputs.web }}
      e2e: ${{ steps.areas.outputs.e2e }}
      dotnet_services: ${{ steps.areas.outputs.dotnet_services }}
      hosted: ${{ steps.areas.outputs.hosted }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A new branch has no previous commit to diff against (before is all zeros), and a manual run
      # has no diff at all, so both run every area and every C# service.
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ "$EVENT" = push ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            base="$BEFORE"
          fi

          if [ -z "$base" ]; then
            bash scripts/ci/changed-areas.sh --all >> "$GITHUB_OUTPUT"
          else
            # Captured first, so a failing git fails this job instead of feeding changed-areas.sh
            # empty input, which would read as "nothing changed" and pass.
            files="$(git -c core.quotepath=false diff --name-only --no-renames "$base...HEAD")"
            printf '%s\n' "$files" | bash scripts/ci/changed-areas.sh >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/core.yml

  canary:
    needs: changes
    if: needs.changes.outputs.canary == 'true'
    uses: ./.github/workflows/canary.yml

  brain:
    needs: changes
    if: needs.changes.outputs.brain == 'true'
    uses: ./.github/workflows/brain.yml

  libs:
    needs: changes
    if: needs.changes.outputs.libs == 'true'
    uses: ./.github/workflows/libs.yml

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the script tests
        run: |
          status=0
          for t in $(find scripts -name '*.test.sh' | sort); do
            echo "== $t"
            bash "$t" || status=1
          done
          exit "$status"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml

  # One run of dotnet.yml per C# service whose code or dependencies changed, each with the fields
  # of its manifest entry, so a C# service added later needs no change here.
  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet_services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.dotnet_services) }}
    uses: ./.github/workflows/dotnet.yml
    with:
      name: ${{ matrix.service.name }}
      dir: ${{ matrix.service.dir }}
      postgres: ${{ matrix.service.postgres }}
      init_script: ${{ matrix.service.init_script }}
      migrate: ${{ matrix.service.migrate }}
      database: ${{ matrix.service.database }}
      owner: ${{ matrix.service.owner }}
      app: ${{ matrix.service.app }}
      owner_url: ${{ matrix.service.owner_url }}
      app_url: ${{ matrix.service.app_url }}
      owner_password: ${{ matrix.service.owner_password }}
      app_password: ${{ matrix.service.app_password }}

  # The hosted images built and checked, only when the change reaches what they are built from, as
  # changed-areas.sh decides, since the build adds minutes to every run that has it.
  hosted:
    needs: changes
    if: needs.changes.outputs.hosted == 'true'
    uses: ./.github/workflows/hosted.yml

  # Fails unless every job above succeeded or was skipped. Runs even when one of them failed
  # or was cancelled, which is what `always()` is for.
  ci-ok:
    needs: [changes, core, canary, brain, libs, scripts, web, e2e, dotnet, hosted]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Judge the other jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | bash scripts/ci/ci-ok.sh
