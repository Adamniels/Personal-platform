# Canary's checks: lint, format and tests. Runs only when canary changes, see
# "One repository" in High-level/docs/platform-architecture.md.
name: Canary

on:
  # Called by ci.yml, which decides from the diff whether it runs.
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: canary

    steps:
      - uses: actions/checkout@v7

      # uv then finds a Python matching canary/.python-version, the runner's
      # own if it has one, or downloads it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest
