# The acceptance suite: the whole stack up, driven by a browser through
# https://platform.test the way a person would use it. See e2e/README.md.
name: E2E

on:
  # Called by ci.yml, which decides from the diff whether it runs.
  workflow_call:
  workflow_dispatch:

# Read only: no job here writes to the repository or to GitHub.
permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway values for a stack that lives as long as the job. Each
    # service's owner and app strings are built by services.sh from
    # infra/.env, for its migrate and its start alone. The core's app string
    # here is only written into Core/.env.
    env:
      CORE_APP_DATABASE_URL: postgres://core_app:ci-only-app@127.0.0.1:5432/core
      # Every compile reads the checked in Core/.sqlx cache. Keygen builds the
      # core before Postgres is up, and one setting for every build avoids a
      # rebuild when it changes.
      SQLX_OFFLINE: "true"
      # Every uv run, in canary/, Brain/ and e2e/, fails on a uv.lock that
      # does not match its pyproject.toml instead of updating it.
      UV_LOCKED: "1"

    steps:
      - uses: actions/checkout@v7

      # Unlike the service containers in core.yml and brain.yml, compose
      # creates the databases and roles itself from these five passwords.
      - name: Write infra/.env
        run: |
          {
            echo POSTGRES_PASSWORD=ci-only-superuser
            echo CORE_OWNER_PASSWORD=ci-only-owner
            echo CORE_APP_PASSWORD=ci-only-app
            echo BRAIN_OWNER_PASSWORD=ci-only-brain-owner
            echo BRAIN_APP_PASSWORD=ci-only-brain-app
          } > infra/.env

      - name: Install Rust
        working-directory: Core
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: Core

      # 0.0.0.0 for the reason given at "Migrate and start every service".
      - name: Write Core/.env
        working-directory: Core
        run: |
          {
            echo CORE_LISTEN_ADDR=0.0.0.0:8080
            echo CORE_PUBLIC_ORIGIN=https://platform.test
            echo "CORE_APP_DATABASE_URL=$CORE_APP_DATABASE_URL"
          } > .env
          cargo run --locked -q -- keygen >> .env

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Every frontend is built before the services start, so the pages they
      # serve exist, and design/ui's install also provides the axe-core the
      # accessibility check injects. See e2e/README.md.
      - name: Build every frontend
        run: |
          for dir in $(bash scripts/ci/frontends.sh); do
            echo "== $dir"
            (cd "$dir" && npm ci && npm run build)
          done

      - name: Point platform.test at this machine
        run: echo "127.0.0.1 platform.test" | sudo tee -a /etc/hosts

      - name: Start Postgres and Caddy
        working-directory: infra
        run: docker compose up -d --wait

      # --wait only waits for the container to run, and the image has no
      # healthcheck. Its init time server listens on the unix socket only, so
      # a login over TCP succeeds only once the real server is up with the
      # roles created. brain.sh runs before core.sh, so core_owner logging in
      # means both have run.
      - name: Wait for Postgres
        working-directory: infra
        env:
          PGPASSWORD: ci-only-owner
        run: |
          for _ in $(seq 1 30); do
            if docker compose exec -T -e PGPASSWORD postgres psql -h 127.0.0.1 -U core_owner -d core -c 'select 1' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "postgres never accepted core_owner over TCP" >&2
          exit 1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"

      # Every service in infra/services.json, in its order: migrated as its
      # owner role, then started in the background as its app role, each
      # database URL built by services.sh from infra/.env above. HOST=0.0.0.0
      # because Caddy runs in a container, so its traffic arrives on the
      # Docker bridge and not on loopback; the runner is thrown away
      # afterwards, so binding on every interface is safe here. The core
      # reads its address from Core/.env instead.
      - name: Migrate and start every service
        run: |
          for name in $(bash scripts/agent/services.sh names); do
            echo "== $name"
            bash scripts/agent/services.sh run "$name" migrate
            HOST=0.0.0.0 nohup bash scripts/agent/services.sh run "$name" start > "$RUNNER_TEMP/$name.log" 2>&1 &
          done

      # Every service's health path through Caddy, /login for the core
      # rather than /, which answers 303 while signed out. -k because Caddy's
      # local CA is not trusted here.
      - name: Wait for the platform
        run: |
          paths="$(bash scripts/agent/services.sh health)"
          for _ in $(seq 1 180); do
            up=true
            for health_path in $paths; do
              if [ "$(curl -ks -o /dev/null -w '%{http_code}' "https://platform.test$health_path")" != 200 ]; then
                up=false
                break
              fi
            done
            if [ "$up" = true ]; then
              exit 0
            fi
            sleep 2
          done
          echo "platform.test never answered 200 on every one of: $paths" >&2
          for name in $(bash scripts/agent/services.sh names); do
            echo "--- $name log" >&2
            tail -n 50 "$RUNNER_TEMP/$name.log" >&2 || true
          done
          exit 1

      - name: Install the browser
        working-directory: e2e
        run: uv run playwright install --with-deps chromium

      - name: Run the suite
        working-directory: e2e
        run: uv run pytest

      - name: Lint
        working-directory: e2e
        run: uv run ruff check

      - name: Format
        working-directory: e2e
        run: uv run ruff format --check

      - name: Show the server logs
        if: failure()
        run: |
          for name in $(bash scripts/agent/services.sh names); do
            echo "--- $name log"
            tail -n 100 "$RUNNER_TEMP/$name.log" || true
          done

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: e2e/screenshots/
          if-no-files-found: warn
