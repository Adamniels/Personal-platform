# The hosted check: infra/hosted/check.sh builds every image, starts a throwaway copy of the hosted
# stack, and runs its cases, the acceptance suite and the backup round trip against it. See
# "check.sh" and "In CI" in infra/hosted/README.md.
name: Hosted

on:
  # Called by ci.yml, only when changed-areas.sh prints hosted=true: building the images adds
  # minutes, so a change that cannot reach them does not pay for it.
  workflow_call:

# Read only: no job here writes to the repository or to GitHub.
permissions:
  contents: read

jobs:
  check:
    # arm64, the architecture the hosted copy runs on, the Mac mini's: the images are proven on what
    # is released. GitHub's arm64 runners are free for a public repository.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    # Every uv run, check.sh's suite among them, fails on a uv.lock that does not match its
    # pyproject.toml instead of updating it.
    env:
      UV_LOCKED: "1"

    # No Rust, .NET or Docker layer cache: the images bring their own toolchains, and the job runs
    # rarely enough that a cache waits until its time is known.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The suite browses https://platform.test:9443, the test front check.sh publishes on
      # 127.0.0.1.
      - name: Point platform.test at this machine
        run: echo "127.0.0.1 platform.test" | sudo tee -a /etc/hosts

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"

      - name: Install the browser
        working-directory: e2e
        run: uv run playwright install --with-deps chromium

      # The suite's accessibility checks inject design/ui/node_modules/axe-core/axe.min.js from
      # the checkout, so design/ui's packages are installed, and nothing is built: every page the
      # suite opens is served from the images.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install design/ui's packages
        working-directory: design/ui
        run: npm ci

      - name: Run the hosted check
        env:
          HOSTED_CHECK_LOGS: ${{ runner.temp }}/hosted-logs
        run: bash infra/hosted/check.sh

      - name: Upload the compose logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-logs
          path: ${{ runner.temp }}/hosted-logs/
          if-no-files-found: warn
