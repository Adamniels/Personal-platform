name: personal-platform

services:
  postgres:
    # .github/workflows/core.yml tests against the same image; change both.
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      CORE_OWNER_PASSWORD: ${CORE_OWNER_PASSWORD:?set CORE_OWNER_PASSWORD in infra/.env}
      CORE_APP_PASSWORD: ${CORE_APP_PASSWORD:?set CORE_APP_PASSWORD in infra/.env}
      BRAIN_OWNER_PASSWORD: ${BRAIN_OWNER_PASSWORD:?set BRAIN_OWNER_PASSWORD in infra/.env}
      BRAIN_APP_PASSWORD: ${BRAIN_APP_PASSWORD:?set BRAIN_APP_PASSWORD in infra/.env}
      REVIEW_OWNER_PASSWORD: ${REVIEW_OWNER_PASSWORD:?set REVIEW_OWNER_PASSWORD in infra/.env}
      REVIEW_APP_PASSWORD: ${REVIEW_APP_PASSWORD:?set REVIEW_APP_PASSWORD in infra/.env}
      DEVFLOW_OWNER_PASSWORD: ${DEVFLOW_OWNER_PASSWORD:?set DEVFLOW_OWNER_PASSWORD in infra/.env}
      DEVFLOW_APP_PASSWORD: ${DEVFLOW_APP_PASSWORD:?set DEVFLOW_APP_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
  caddy:
    image: caddy:2
    # Docker Desktop defines host.docker.internal already, Linux does not, and
    # the Caddyfile proxies to it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Served at /design/, only the paths the Caddyfile names.
      - ../design:/srv/design:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config: