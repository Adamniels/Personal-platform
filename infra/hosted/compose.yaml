# The hosted copy of the platform: every service in a container, one compose project apart from
# the dev stack in infra/compose.yaml. See README.md beside this file.
#
# There is deliberately no top level name. The project is always given with -p: the real copy's
# by the release script, and check.sh's own, hostedcheck. A command typed without -p gets the
# folder's name, hosted, which is neither, so a command typed in another clone never reaches the
# real copy by accident.
#
# Every image builds from the repository root, since services install libs/ and design/ui by path.
# Each service reads its settings from the environment, by the names it reads natively; the
# values come from .env beside this file, see .env.example. Each database URL is
# postgres://<role>:<password>@postgres:5432/<database>, so the passwords are letters and digits.
#
# Each service with a migrate in infra/services.json has a <name>-migrate service in the migrate
# profile, the same image running its migrate command as the database's owner. No serving
# container has the owner's URL. tests/agree.test.sh checks this file against the manifest.
#
# The backup service dumps every database each night as platform_backup, encrypted to a public
# key, and uploads it; see "Backups" in README.md.

services:
  postgres:
    # The image infra/compose.yaml and CI run.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see .env.example}
      CORE_OWNER_PASSWORD: ${CORE_OWNER_PASSWORD:?set CORE_OWNER_PASSWORD, see .env.example}
      CORE_APP_PASSWORD: ${CORE_APP_PASSWORD:?set CORE_APP_PASSWORD, see .env.example}
      BRAIN_OWNER_PASSWORD: ${BRAIN_OWNER_PASSWORD:?set BRAIN_OWNER_PASSWORD, see .env.example}
      BRAIN_APP_PASSWORD: ${BRAIN_APP_PASSWORD:?set BRAIN_APP_PASSWORD, see .env.example}
      REVIEW_OWNER_PASSWORD: ${REVIEW_OWNER_PASSWORD:?set REVIEW_OWNER_PASSWORD, see .env.example}
      REVIEW_APP_PASSWORD: ${REVIEW_APP_PASSWORD:?set REVIEW_APP_PASSWORD, see .env.example}
      DEVFLOW_OWNER_PASSWORD: ${DEVFLOW_OWNER_PASSWORD:?set DEVFLOW_OWNER_PASSWORD, see .env.example}
      DEVFLOW_APP_PASSWORD: ${DEVFLOW_APP_PASSWORD:?set DEVFLOW_APP_PASSWORD, see .env.example}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD, see .env.example}
    # Published nowhere: only the services on this project's network reach it.
    volumes:
      - pgdata:/var/lib/postgresql
      # The dev stack's init scripts, run in name order when the volume is first created, see
      # "The databases" in infra/README.md; then the backup role's, last, since it grants CONNECT
      # on the databases they create. One file each, since a file cannot be mounted inside a
      # folder mounted read only; tests/agree.test.sh checks each dev script is here.
      - ../postgres/initdb/brain.sh:/docker-entrypoint-initdb.d/brain.sh:ro
      - ../postgres/initdb/core.sh:/docker-entrypoint-initdb.d/core.sh:ro
      - ../postgres/initdb/devflow.sh:/docker-entrypoint-initdb.d/devflow.sh:ro
      - ../postgres/initdb/review.sh:/docker-entrypoint-initdb.d/review.sh:ro
      - ./postgres/backup-role.sh:/docker-entrypoint-initdb.d/zz-backup-role.sh:ro
    healthcheck:
      # Over TCP, so the server the image runs while the init scripts run, on a socket only, does
      # not count as ready.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  core:
    image: platform-hosted/core:${PLATFORM_RELEASE:-dev}
    build:
      context: ../..
      dockerfile: Core/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORE_LISTEN_ADDR: 0.0.0.0:8080
      CORE_PUBLIC_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN:?set PLATFORM_PUBLIC_ORIGIN, see .env.example}
      # Without a default, unlike the rest, so `run --rm --no-deps core keygen` can make it before
      # it exists. The core refuses to start without it.
      CORE_SIGNING_KEY: ${CORE_SIGNING_KEY:-}
      CORE_FEATURE_REGISTRY: /app/features.toml
      CORE_APP_DATABASE_URL: postgres://core_app:${CORE_APP_PASSWORD:?set CORE_APP_PASSWORD, see .env.example}@postgres:5432/core
      # The backup job's status file, for the line on the front page, see "The backup line on the
      # front page" in Core/docs/core-architecture.md.
      CORE_BACKUP_STATUS_FILE: /status/backup.json
    volumes:
      # Read only: the core reads the backup job's status and never writes there.
      - backup_status:/status:ro

  core-migrate:
    image: platform-hosted/core:${PLATFORM_RELEASE:-dev}
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    environment:
      CORE_OWNER_DATABASE_URL: postgres://core_owner:${CORE_OWNER_PASSWORD:?set CORE_OWNER_PASSWORD, see .env.example}@postgres:5432/core

  canary:
    image: platform-hosted/canary:${PLATFORM_RELEASE:-dev}
    build:
      context: ../..
      dockerfile: canary/Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "canary.app:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      CANARY_CORE_URL: http://core:8080
      CANARY_PUBLIC_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN:?set PLATFORM_PUBLIC_ORIGIN, see .env.example}

  brain:
    image: platform-hosted/brain:${PLATFORM_RELEASE:-dev}
    build:
      context: ../..
      dockerfile: Brain/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "brain.app:app", "--host", "0.0.0.0", "--port", "8082"]
    environment:
      BRAIN_CORE_URL: http://core:8080
      BRAIN_PUBLIC_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN:?set PLATFORM_PUBLIC_ORIGIN, see .env.example}
      BRAIN_APP_DATABASE_URL: postgres://brain_app:${BRAIN_APP_PASSWORD:?set BRAIN_APP_PASSWORD, see .env.example}@postgres:5432/brain

  brain-migrate:
    image: platform-hosted/brain:${PLATFORM_RELEASE:-dev}
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["brain", "migrate"]
    environment:
      BRAIN_OWNER_DATABASE_URL: postgres://brain_owner:${BRAIN_OWNER_PASSWORD:?set BRAIN_OWNER_PASSWORD, see .env.example}@postgres:5432/brain

  review:
    image: platform-hosted/review:${PLATFORM_RELEASE:-dev}
    build:
      context: ../..
      dockerfile: review/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REVIEW_LISTEN_ADDR: 0.0.0.0:8083
      REVIEW_CORE_URL: http://core:8080
      REVIEW_BRAIN_URL: http://brain:8082
      REVIEW_PUBLIC_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN:?set PLATFORM_PUBLIC_ORIGIN, see .env.example}
      REVIEW_APP_DATABASE_URL: postgres://review_app:${REVIEW_APP_PASSWORD:?set REVIEW_APP_PASSWORD, see .env.example}@postgres:5432/review

  review-migrate:
    image: platform-hosted/review:${PLATFORM_RELEASE:-dev}
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    environment:
      REVIEW_OWNER_DATABASE_URL: postgres://review_owner:${REVIEW_OWNER_PASSWORD:?set REVIEW_OWNER_PASSWORD, see .env.example}@postgres:5432/review

  devflow:
    image: platform-hosted/devflow:${PLATFORM_RELEASE:-dev}
    build:
      context: ../..
      dockerfile: devflow/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEVFLOW_LISTEN_ADDR: 0.0.0.0:8084
      DEVFLOW_CORE_URL: http://core:8080
      DEVFLOW_PUBLIC_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN:?set PLATFORM_PUBLIC_ORIGIN, see .env.example}
      DEVFLOW_APP_DATABASE_URL: postgres://devflow_app:${DEVFLOW_APP_PASSWORD:?set DEVFLOW_APP_PASSWORD, see .env.example}@postgres:5432/devflow
      # The code host, passed empty when unset, which Dev flow refuses rather than taking the fake,
      # its default elsewhere: the fake must never be on where real data is.
      DEVFLOW_CODE_HOST: ${DEVFLOW_CODE_HOST:-}
      # The vault's keys, passed empty when unset, so Dev flow is what refuses, naming the setting.
      DEVFLOW_VAULT_KEY: ${DEVFLOW_VAULT_KEY:-}
      DEVFLOW_VAULT_OLD_KEYS: ${DEVFLOW_VAULT_OLD_KEYS:-}
      # The GitHub App Dev flow reads repositories as, passed empty when unset, so Dev flow is what
      # refuses, naming the setting.
      DEVFLOW_GITHUB_CLIENT_ID: ${DEVFLOW_GITHUB_CLIENT_ID:-}
      DEVFLOW_GITHUB_CLIENT_SECRET: ${DEVFLOW_GITHUB_CLIENT_SECRET:-}
      DEVFLOW_GITHUB_APP_SLUG: ${DEVFLOW_GITHUB_APP_SLUG:-}
      # How often Dev flow reads every project, passed empty when unset, which Dev flow takes as
      # unset, so its default, a minute, stands.
      DEVFLOW_POLL_SECONDS: ${DEVFLOW_POLL_SECONDS:-}
      # The app's private key, from the file the volume below mounts. In the .env this setting is
      # the file's path on the machine; Dev flow is given the path inside its container.
      DEVFLOW_GITHUB_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
    volumes:
      # Read only, and never made: a path that names no file stops compose rather than mounting an
      # empty folder Docker would create in its place.
      - type: bind
        source: ${DEVFLOW_GITHUB_PRIVATE_KEY_FILE:?set DEVFLOW_GITHUB_PRIVATE_KEY_FILE, see .env.example}
        target: /run/secrets/github-app.pem
        read_only: true
        bind:
          create_host_path: false

  devflow-migrate:
    image: platform-hosted/devflow:${PLATFORM_RELEASE:-dev}
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    environment:
      DEVFLOW_OWNER_DATABASE_URL: postgres://devflow_owner:${DEVFLOW_OWNER_PASSWORD:?set DEVFLOW_OWNER_PASSWORD, see .env.example}@postgres:5432/devflow

  # The worker's base image, built at every release and never started: no replica, so `compose build`
  # in the release script builds it and `compose up` starts nothing. A project's worker is built
  # FROM it and started by the command on the project's page, outside this project; see "The
  # images" in README.md and "Starting a worker" in devflow/README.md.
  devflow-worker:
    image: platform-hosted/devflow-worker:${PLATFORM_RELEASE:-dev}
    build:
      context: ../..
      dockerfile: devflow/worker.Dockerfile
    deploy:
      replicas: 0

  proxy:
    image: platform-hosted/proxy:${PLATFORM_RELEASE:-dev}
    build:
      context: ../..
      dockerfile: infra/hosted/proxy/Dockerfile
    restart: unless-stopped
    # The only port published, plain HTTP on the loopback; HTTPS is terminated in front of it.
    ports:
      - "${HOSTED_HTTP_BIND:-127.0.0.1:9080}:80"

  backup:
    image: platform-hosted/backup:${PLATFORM_RELEASE:-dev}
    build:
      context: ../..
      dockerfile: infra/hosted/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # `schedule`, the image's default. `docker compose run --rm backup now` runs one backup, and
    # `restore` one restore, see README.md. Each setting is checked by the job, which names the one
    # missing or malformed, so none stops the rest of the stack from starting. The defaults are
    # the job's. POSTGRES_PASSWORD is never here: a restore is given it by the person running it.
    environment:
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_KEY_ID: ${BACKUP_S3_KEY_ID:-}
      BACKUP_S3_KEY: ${BACKUP_S3_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_AT: ${BACKUP_AT:-}
      TZ: ${TZ:-}
      BACKUP_KEEP_LOCAL_DAYS: ${BACKUP_KEEP_LOCAL_DAYS:-}
    volumes:
      - backups:/backups
      # Read only by the core, for the backup line on the front page.
      - backup_status:/status

volumes:
  pgdata:
  backups:
  backup_status:
