[project]
name = "platform-auth"
version = "0.1.0"
description = "Checking the core's access token and the Origin header, for every Python service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.13.1",
    "pyjwt[crypto]>=2.15.1",
    "starlette>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
