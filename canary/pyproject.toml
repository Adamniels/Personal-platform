[project]
name = "canary"
version = "0.1.0"
description = "The platform's first feature, proving another language can verify the token"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
