[package]
name = "platform_core"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "sqlx-toml"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
