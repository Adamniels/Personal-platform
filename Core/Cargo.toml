[package]
name = "platform_core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8.9"
base64 = "0.23.1"
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8"] }
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "sqlx-toml", "time", "uuid"] }
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
# The test harness builds its template database once per test binary.
tokio = { version = "1.53.1", features = ["sync"] }
