# Where sqlx's query macros and `cargo sqlx prepare` find the database. The app
# role, so building never needs the owner's connection string. Migrations do not
# go through sqlx-cli; the core's `migrate` subcommand runs them as the owner.
# See "Row level security does not apply here" in docs/core-architecture.md.
[common]
database-url-var = "CORE_APP_DATABASE_URL"
