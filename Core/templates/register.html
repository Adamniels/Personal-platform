{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<h1>Create your account</h1>

{% if let Some(error) = error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}

<form method="post" action="/register">
  <label>
    Invite code
    <input name="code" value="{{ code }}" required autocomplete="off" spellcheck="false">
  </label>
  <label>
    Email
    <input name="email" type="email" value="{{ email }}" required autocomplete="email">
  </label>
  <label>
    Password
    <span class="hint">15 characters or more</span>
    <input name="password" type="password" required minlength="15" maxlength="1024" autocomplete="new-password">
  </label>
  <button type="submit">Create account</button>
</form>
{% endblock %}
