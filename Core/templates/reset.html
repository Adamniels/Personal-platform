{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
<h1>Choose a new password</h1>

{% if let Some(error) = error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}

<form method="post" action="/reset">
  <label>
    Reset token
    <input name="token" value="{{ token }}" required autocomplete="off" spellcheck="false">
  </label>
  <label>
    New password
    <span class="hint">15 characters or more</span>
    <input name="password" type="password" required minlength="15" maxlength="1024" autocomplete="new-password">
  </label>
  <button type="submit">Set password</button>
</form>
{% endblock %}
